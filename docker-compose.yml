services:
  flintbay:
    ## One multi-architecture image covers amd64 and arm64 (Jetson/RPi); Docker
    ## picks the variant matching the host. Pin an explicit version or an index
    ## digest in production — see docs/upgrading.md.
    image: ghcr.io/flintbayhq/flintbay:latest
    ports:
      # WEB_PORT is a host-side Compose input, not an image runtime variable.
      - "${WEB_PORT:-19580}:19580"
      ## Live-video transport for camera/stream Sources. WebRTC carries media
      ## over its own port because ICE is not HTTP and cannot share 19580.
      ## Keep the host and container numbers equal: the container advertises
      ## its own port number in ICE candidates. Remote deployments must also
      ## open it in the firewall or cloud security group; without it playback
      ## silently falls back to higher-latency LL-HLS over 19580.
      - "${MEDIA_PORT:-8189}:${MEDIA_PORT:-8189}/udp"
      - "${MEDIA_PORT:-8189}:${MEDIA_PORT:-8189}/tcp"
    volumes:
      - flintbay_data:/var/lib/flintbay
    environment:
      ## ─── Public origin & profile ───────────────────────────────────────
      ## Set the externally reachable origin. HTTPS automatically derives
      ## secure cookies; CORS and MCP metadata derive from the same value.
      FLINTBAY_PUBLIC_URL: "${FLINTBAY_PUBLIC_URL:-http://localhost:19580}"
      FLINTBAY_RESOURCE_PROFILE: "${FLINTBAY_RESOURCE_PROFILE:-edge}"

      ## ─── Live video ───────────────────────────────────────────────────
      ## The media gateway is on by default; RTSP/RTMP/SRT camera Sources
      ## play as low-latency WebRTC with automatic LL-HLS fallback. The
      ## advertised media port must match the published one above.
      FLINTBAY_MEDIA_WEBRTC_PORT: "${MEDIA_PORT:-8189}"

      ## The ICE host is derived from FLINTBAY_PUBLIC_URL. Set it only when the
      ## browser reaches media through a different address than the origin.
      # FLINTBAY_MEDIA_WEBRTC_HOST: "media.example.com"
      ## Turn live video off entirely; camera Sources then stop playing.
      # FLINTBAY_MEDIA_GATEWAY_ENABLED: "false"
      ## Concurrent viewers sharing one upstream pull (edge default 8).
      # FLINTBAY_MEDIA_GATEWAY_MAX_READERS: "32"

      ## Keep one worker: connector/cache/runtime reload state is process-local.
      FLINTBAY_API_WORKERS: "1"

      ## Optional explicit networking overrides. Usually FLINTBAY_PUBLIC_URL is enough.
      # FLINTBAY_CORS_ORIGINS: "https://dashboard.example.com"
      # FLINTBAY_COOKIE_SECURE: "true"
      # FLINTBAY_COOKIE_SAMESITE: "strict"
      # FLINTBAY_COOKIE_DOMAIN: ""
      # FLINTBAY_TRUSTED_PROXIES: "172.16.0.0/12"

      ## ─── Authentication ───────────────────────────────────────────────
      ## JWT secret is auto-generated and persisted when omitted.
      # FLINTBAY_JWT_SECRET_KEY: "use-at-least-32-random-bytes"
      # FLINTBAY_JWT_PREVIOUS_SECRET_KEY: ""
      # FLINTBAY_JWT_TOKEN_EXPIRE_MINUTES: "30"
      # FLINTBAY_SESSION_MAX_CONCURRENT: "5"
      # FLINTBAY_SESSION_REFRESH_TOKEN_EXPIRE_DAYS: "30"

      ## ─── Database & Redis ─────────────────────────────────────────────
      ## Embedded passwords are generated and persisted when omitted.
      # FLINTBAY_POSTGRES_PASSWORD: "your-secure-password"
      # FLINTBAY_REDIS_PASSWORD: "your-secure-password"

      ## Explicit URLs disable only the corresponding embedded daemon.
      # FLINTBAY_DATABASE_URL: "postgresql://user:pass@host:5432/flintbay"
      # FLINTBAY_REDIS_URL: "redis://:password@host:6379/0"

      ## ─── MCP ──────────────────────────────────────────────────────────
      ## Enabled by default at ${FLINTBAY_PUBLIC_URL:-http://localhost:19580}/mcp.
      # FLINTBAY_MCP_ENABLE: "false"
      # FLINTBAY_MCP_PUBLIC_URL: "https://your-domain.example/mcp"
      # FLINTBAY_MCP_ISSUER_URL: "https://your-domain.example/api"
      # FLINTBAY_MCP_LOG_LEVEL: "INFO"

      ## ─── Resource overrides ───────────────────────────────────────────
      ## edge defaults shown; use FLINTBAY_RESOURCE_PROFILE=balanced for larger hosts.
      # FLINTBAY_DB_POOL_MIN: "1"
      # FLINTBAY_DB_POOL_MAX: "5"
      # FLINTBAY_POSTGRES_SHARED_BUFFERS: "64MB"
      # FLINTBAY_POSTGRES_MAX_CONNECTIONS: "20"
      # FLINTBAY_POSTGRES_WORK_MEM: "2MB"
      # FLINTBAY_POSTGRES_MAINTENANCE_WORK_MEM: "32MB"
      # FLINTBAY_POSTGRES_JIT: "off"
      # FLINTBAY_REDIS_MAXMEMORY: "128mb"
      # FLINTBAY_REDIS_MAXMEMORY_POLICY: "allkeys-lru"

      ## At zero demand, "off" suspends subscriptions; "on" keeps them active.
      # FLINTBAY_REST_BACKGROUND_MIN_POLL_INTERVAL_MS: "5000"
      # FLINTBAY_MQTT_BACKGROUND_ENABLED: "off"
      # FLINTBAY_WS_BACKGROUND_ENABLED: "off"
      # FLINTBAY_ROS2_BACKGROUND_ENABLED: "off"

      # FLINTBAY_CONNECTOR_SEND_CONCURRENCY: "4"
      # FLINTBAY_CONNECTOR_SEND_MAX_WAITERS: "16"
      # FLINTBAY_CONNECTOR_SEND_WAIT_TIMEOUT_MS: "250"
      # FLINTBAY_BINDING_PROCESS_CONCURRENCY: "2"
      # FLINTBAY_BINDING_PROCESS_MAX_WAITERS: "16"
      # FLINTBAY_BINDING_PROCESS_WAIT_TIMEOUT_MS: "250"
      # FLINTBAY_BINDING_INBOUND_ENDPOINT_CONCURRENCY: "4"
      # FLINTBAY_BINDING_INBOUND_QUEUE_SIZE: "16"
      # FLINTBAY_REALTIME_OUTBOX_CRITICAL_SIZE: "32"
      # FLINTBAY_REALTIME_OUTBOX_STATE_KEYS: "64"
      # FLINTBAY_REALTIME_SEND_TIMEOUT_MS: "5000"
      # FLINTBAY_REALTIME_BROADCAST_CONCURRENCY: "8"
      # FLINTBAY_WS_MAX_QUEUE: "8"

      ## Redis can share binding state, but cannot distribute runtime reloads.
      # FLINTBAY_BINDING_STATE_BACKEND: "memory"
      # FLINTBAY_BINDING_STATE_LOCK_WAIT_MS: "1000"
      # FLINTBAY_ENDPOINT_STATE_BACKEND: "memory"
      # FLINTBAY_ENDPOINT_STATE_TTL_S: "3600"
      # FLINTBAY_ENDPOINT_STATE_STALE_THRESHOLD_S: "300"

      ## ─── Retention, push, and observability ───────────────────────────
      # FLINTBAY_AUDIT_RETENTION_DAYS: "90"
      # FLINTBAY_CONNECTION_LOG_RETENTION_DAYS: "7"
      # FLINTBAY_SYSTEM_LOG_RETENTION_DAYS: "30"
      # FLINTBAY_VAPID_PUBLIC_KEY: ""
      # FLINTBAY_VAPID_PRIVATE_KEY: ""
      # FLINTBAY_VAPID_CONTACT_EMAIL: "mailto:admin@example.com"
      # FLINTBAY_INTERNAL_API_KEY: ""
      # FLINTBAY_METRICS_ENABLED: "true"

      ## ─── API and diagnostics ──────────────────────────────────────────
      # FLINTBAY_API_ENABLE_DOCS: "true"
      # FLINTBAY_LOG_LEVEL: "WARNING"
      # FLINTBAY_MEMPROF_ENABLED: "1"
      # FLINTBAY_MEMPROF_TOKEN: "change-me"
    restart: unless-stopped

volumes:
  flintbay_data:
